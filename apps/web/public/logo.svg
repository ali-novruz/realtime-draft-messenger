<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Main Chat Bubble -->
  <path d="M256 64C132.3 64 32 150.1 32 256c0 58.7 30.7 111.4 80 146.4 0 0-8.8 44.4-38.4 68.8 0 0 102.4 8.8 144.3-33.1 12.3 2 25 3.9 38.1 3.9 123.7 0 224-86.1 224-192S379.7 64 256 64z" fill="url(#primaryGradient)" filter="url(#glow)"/>
  
  <!-- Writing/Drafting Animation Elements -->
  <!-- Line 1 -->
  <rect x="112" y="190" width="180" height="24" rx="12" fill="white" fill-opacity="0.9">
    <animate attributeName="width" values="0;180;180;180" dur="3s" repeatCount="indefinite" />
     <animate attributeName="opacity" values="0;1;1;0" dur="3s" repeatCount="indefinite" />
  </rect>
  
  <!-- Line 2 -->
  <rect x="112" y="250" width="288" height="24" rx="12" fill="white" fill-opacity="0.6">
    <animate attributeName="width" values="0;288;288;288" begin="0.8s" dur="3s" repeatCount="indefinite" />
     <animate attributeName="opacity" values="0;1;1;0" begin="0.8s" dur="3s" repeatCount="indefinite" />
  </rect>
  
  <!-- Line 3 (Cursor) -->
  <rect x="112" y="310" width="20" height="24" rx="4" fill="white" fill-opacity="1">
    <animate attributeName="x" values="112; 260; 260; 112" begin="1.6s" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
  </rect>
</svg>
